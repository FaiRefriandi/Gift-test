<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift</title>
    <link rel="preload" href="bg-poster.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="walking-backhome.mp3" as="audio" type="audio/mpeg" fetchpriority="high" />
    <link rel="preload" href="1.png" as="image" />
    <link rel="preload" href="2.png" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-label="Animated gift scene">
      <img class="scene-bg" src="bg-poster.jpg" data-src="bg.gif" alt="" width="281" height="498" loading="eager" decoding="async" aria-hidden="true" />
      <div class="vignette"></div>

      <button class="character-button" type="button" aria-label="Ubah ekspresi karakter" aria-pressed="false">
        <img class="character" src="1.png" alt="Karakter pixel art" draggable="false" />
      </button>

      <section class="message" aria-label="Pesan">
        <p id="lyricLine">Mr. Blue Melville was a sailor at dawn</p>
      </section>

      <audio id="song" src="walking-backhome.mp3" type="audio/mpeg" preload="auto" autoplay playsinline></audio>
    </main>

    <script src="script.js"></script>
  </body>
</html>
